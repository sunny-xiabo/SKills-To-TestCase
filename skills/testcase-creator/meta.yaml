name: testcase-creator
description: "结合文字需求、文档、设计稿与代码范围分析，支持全量新建与增量变更（补/改/废），检查点推荐与历史复用，评审迭代与多平台导出（Jira CSV / Excel / XMind）"
version: "1.12.0"

platforms:
  claude:
    path: ".claude/commands/testcase-creator.md"
    frontmatter:
      description: "{{description}}"
    body_from: prompt.md

  cursor:
    path: ".cursor/skills/testcase-creator/skill.md"
    frontmatter:
      name: "{{name}}"
      description: "{{description}}"
      triggers:
        - "/testcase-creator"
    body_from: prompt.md

  agents:
    path: ".agents/skills/source-command-testcase-creator/SKILL.md"
    frontmatter:
      name: "source-command-{{name}}"
      description: "结合需求与设计稿导出文件分析，基于检查点/评审点资产按五阶段流程生成测试用例，支持评审迭代与多格式导出"
    body_from: prompt.md
    prepend: |
      # source-command-testcase-creator

      Use this skill when the user asks to run the migrated source command `testcase-creator`.

      ## Command Template
